              "https://ivelly42.github.io/agent-ops-command-center/metrics/status.json"
            ]
          }
          JSON

          submit_payload() {
            local payload="$1"
            local response="$2"

            code="$(curl -sS -o "$response" -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -d @"$payload" \
              https://api.indexnow.org/indexnow)"
            cat "$response" || true
            printf '\n%s HTTP %s\n' "$payload" "$code"

            case "$code" in
              200|202) return 0 ;;
              *) return 1 ;;
            esac
          }

          submit_payload indexnow-payload.json indexnow-response.json

          cat > indexnow-mirror-payload.json <<'JSON'
          {
            "host": "ivelly42.github.io",
            "key": "b18a9177af0e03eb7a80a5ace792472641b328df9a607f1f55db81b7098e5656",
