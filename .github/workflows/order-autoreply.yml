name: Order autoreply

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      mock_prefilled_team_request:
        description: Validate the prefilled $203 team request path without creating an issue.
        required: false
        default: "false"
      issue_number:
        description: Existing issue number for dry-run validation.
        required: false
      dry_run:
        description: Do not add labels or comments when true.
        required: false
        default: "true"

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- agent-ops-order-autoreply-v1 -->";
            const eventName = context.eventName;
            const isDispatch = eventName === "workflow_dispatch";
            const inputs = context.payload.inputs || {};
            const dryRun = isDispatch && inputs.dry_run !== "false";
            if (isDispatch && !dryRun) {
              core.setFailed("workflow_dispatch is dry-run only for order autoreply validation.");
              return;
            }

            const { owner, repo } = context.repo;
            let issue = context.payload.issue;
            if (isDispatch && inputs.mock_prefilled_team_request === "true") {
              issue = {
                number: 0,
                title: "Primary team request: Agent Ops Command Center",
                labels: [],
                body: [
                  "Primary team request: Agent Ops Command Center",
                  "",
                  "Request package: Team license - 7 seats - $203 gross",
                  "Purchase intent: Ready to pay $203 for the team license when checkout is ready",
                  "Preferred checkout: Receipt-capable checkout",
                  "Receipt need: Receipt needed after payment",
                  "Current blocker: Waiting for checkout link",
                  "",
                  "Buyer/team:",
                  "- Seven-seat AI-agent operator team",
                  "",
                  "Acknowledgement:",
                  "- I understand this issue is purchase intent only.",
                  "- I understand the private paid ZIP should be delivered only after checkout, receipt, payout, or seller-dashboard proof exists.",
                  "- I understand gross revenue is counted only when payment proof exists."
                ].join("\n")
              };
            } else if (isDispatch && inputs.issue_number) {
              const fetched = await github.rest.issues.get({
                owner,
                repo,
                issue_number: Number(inputs.issue_number)
              });
              issue = fetched.data;
            }

            if (!issue) {
              core.info("No issue supplied; skipping autoreply.");
              return;
            }
            const labels = (issue.labels || []).map((label) =>
              typeof label === "string" ? label : label.name
            );
            const title = issue.title || "";
            const body = issue.body || "";
            const text = `${title}\n${body}`;
            if (labels.includes("not-buyer-intent") ||
              text.includes("agent-ops-discussion-order-bridge-v1") ||
              text.includes("automation-generated bridge from owner-authored discussion")) {
              core.info("Issue is marked not buyer intent; skipping autoreply and labels.");
              return;
            }
            const orderLabels = new Set([
              "order-request",
              "template-pack-request",
              "budget-request",
              "invoice-request",
              "expense-report",
              "quote-request",
              "purchase-order",
              "vendor-onboarding",
              "security-review",
              "delivery-acceptance",
              "payment-ready"
            ]);
            const hasOrderLabel = labels.some((label) => orderLabels.has(label));
            const hasOrderText = [
              "Order request: Agent Ops Command Center",
              "Template pack request: Agent Ops Command Center",
              "Budget request: Agent Ops Command Center",
              "Invoice request: Agent Ops Command Center",
              "Expense report request: Agent Ops Command Center",
              "Quote request: Agent Ops Command Center",
              "Purchase order request: Agent Ops Command Center",
              "Vendor onboarding request: Agent Ops Command Center",
              "Security review request: Agent Ops Command Center",
              "Delivery acceptance request: Agent Ops Command Center",
              "Primary team request: Agent Ops Command Center",
              "Payment-ready request: Agent Ops Command Center",
              "Request package: Team license - 7 seats - $203 gross"
            ].some((needle) => text.includes(needle));

            if (!hasOrderLabel && !hasOrderText) {
              core.info("Issue is not an order-intent issue; skipping autoreply.");
              return;
            }

            const labelsToAdd = new Set();
            const addIfMissing = (label) => {
              if (!labels.includes(label)) labelsToAdd.add(label);
            };

            addIfMissing("order-request");
            if (text.includes("Payment-ready request: Agent Ops Command Center") ||
              text.includes("Ready to pay $203") ||
              text.includes("Purchase intent: Ready to pay") ||
              text.includes("Preferred checkout")) {
              addIfMissing("payment-ready");
            }
            if (text.includes("Template pack request: Agent Ops Command Center")) addIfMissing("template-pack-request");
            if (text.includes("Budget request: Agent Ops Command Center")) addIfMissing("budget-request");
            if (text.includes("Invoice request: Agent Ops Command Center")) addIfMissing("invoice-request");
            if (text.includes("Expense report request: Agent Ops Command Center")) addIfMissing("expense-report");
            if (text.includes("Quote request: Agent Ops Command Center")) addIfMissing("quote-request");
            if (text.includes("Purchase order request: Agent Ops Command Center")) addIfMissing("purchase-order");
            if (text.includes("Vendor onboarding request: Agent Ops Command Center")) addIfMissing("vendor-onboarding");
            if (text.includes("Security review request: Agent Ops Command Center")) addIfMissing("security-review");
            if (text.includes("Delivery acceptance request: Agent Ops Command Center")) addIfMissing("delivery-acceptance");
            if (labelsToAdd.size > 0) labelsToAdd.add("order-autolabeled");

            const addMissingLabels = async () => {
              if (labelsToAdd.size === 0) return;
              if (dryRun) {
                core.info(`Dry run: would add labels ${Array.from(labelsToAdd).sort().join(", ")}.`);
                return;
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: Array.from(labelsToAdd).sort()
              });
            };

            const comments = issue.number
              ? await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              })
              : [];
            if (comments.some((comment) => (comment.body || "").includes(marker))) {
              await addMissingLabels();
              core.info("Autoreply already exists; skipping duplicate.");
              return;
            }

            const reply = [
              marker,
              "Thanks for the Agent Ops Command Center request.",
              "",
              "**Current checkout status:** not live yet.",
              "",
              "**Request package:** Team license - 7 seats - **$203 gross**.",
              "",
              "**Important revenue rule:** this issue is not counted as revenue. Revenue is counted only after checkout, receipt, payout, or seller-dashboard evidence exists.",
              "",
              "**Next buyer-ready paths**",
              "",
              "- Primary team request: https://ivelly42.github.io/agent-ops-command-center/team-request-url.html",
              "- Checkout status: https://ivelly42.github.io/agent-ops-command-center/checkout-status.json",
              "- Payment-ready fallback: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=payment-ready.yml",
              "- Invoice request: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=invoice-request.yml",
              "- Purchase order request: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=purchase-order.yml",
              "- Delivery acceptance request: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=delivery-acceptance.yml",
              "- Public preview: https://ivelly42.github.io/agent-ops-command-center/",
              "- NPM GitHub preview: `npx github:ivelly42/agent-ops-command-center --json`",
              "",
              "**Paid ZIP boundary:** the paid ZIP is not public and should be delivered only after payment proof exists.",
              "",
              "Do not post secrets, card data, tax IDs, private invoices, or private billing details in this public issue."
            ].join("\n");

            if (dryRun) {
              await addMissingLabels();
              core.info("Dry run: would create order autoreply comment.");
              core.info(reply);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: reply
            });
            await addMissingLabels();
