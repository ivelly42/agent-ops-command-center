name: Delivery acceptance request
description: Request paid ZIP delivery, acceptance, archive digest, or handoff details before checkout for the $203 Agent Ops team license
title: "Delivery acceptance request: Agent Ops Command Center"
labels: ["order-request", "delivery-acceptance"]
body:
  - type: markdown
    attributes:
      value: |
        Short request path for buyers who need paid ZIP delivery, acceptance, archive digest, handoff, import target, or delivery-proof details before paying.

        Request package: Team license - 7 seats - $203 gross.
        Individual seat target: $29.

        Checkout is not live yet. This issue records purchase intent and preferred checkout. It is not counted as revenue until checkout, receipt, payout, or seller-dashboard evidence exists.

        Delivery acceptance packet: https://ivelly42.github.io/agent-ops-command-center/team-delivery-acceptance.html
        Paid delivery manifest: https://ivelly42.github.io/agent-ops-command-center/paid-delivery-manifest.md
        Security review form: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=security-review.yml
        Invoice request form: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=invoice-request.yml
        Fast team request page: https://ivelly42.github.io/agent-ops-command-center/team-checkout-request.html
  - type: dropdown
    id: package
    attributes:
      label: Request package
      options:
        - Team license - 7 seats - $203 gross
        - Individual seat - $29
        - Evaluating preview only
    validations:
      required: true
  - type: dropdown
    id: delivery_need
    attributes:
      label: Delivery acceptance need
      options:
        - Need paid ZIP delivery details
        - Need archive digest or manifest details
        - Need import target or handoff details
        - Need acceptance gate before checkout
        - Need delivery proof for procurement
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Preferred checkout
      options:
        - Gumroad
        - Ko-fi
        - Lemon Squeezy
        - PayPal invoice
        - GitHub Sponsors
        - Other
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Purchase intent
      options:
        - I am ready to pay $203 for the 7-seat team license when checkout is ready
        - I am ready to pay $29 when checkout is ready
        - I need delivery, invoice, PO, or security details first
        - I want to evaluate the preview first
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Delivery acknowledgement
      options:
        - label: I understand the paid ZIP is not public and will be delivered only after checkout, receipt, payout, or seller-dashboard evidence exists.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Delivery recipient, import target, archive digest need, acceptance gate, handoff blocker, procurement proof need, or checkout preference.
    validations:
      required: false
