name: Budget request
description: Request the $203 Agent Ops team license after manager or budget approval
title: "Budget request: Agent Ops Command Center"
labels: ["order-request", "budget-request"]
body:
  - type: markdown
    attributes:
      value: |
        Short request path for buyers coming from the budget request email, manager approval, reimbursement, or procurement approval path.

        Request package: Team license - 7 seats - $203 gross.
        Individual seat target: $29.

        Checkout is not live yet. This issue records purchase intent and preferred checkout. It is not counted as revenue until checkout, receipt, payout, or seller-dashboard evidence exists.

        Budget request Discussion: https://github.com/ivelly42/agent-ops-command-center/discussions/8
        Team procurement email kit: https://ivelly42.github.io/agent-ops-command-center/team-procurement-email.html
        Purchase approval brief: https://ivelly42.github.io/agent-ops-command-center/purchase-approval-brief.html
        Fast team request page: https://ivelly42.github.io/agent-ops-command-center/team-checkout-request.html
        Discovery hub: https://ivelly42.github.io/agent-ops-command-center/discovery.html
  - type: dropdown
    id: package
    attributes:
      label: Request package
      options:
        - Team license - 7 seats - $203 gross
        - Individual seat - $29
        - Evaluating preview only
    validations:
      required: true
  - type: dropdown
    id: approval_state
    attributes:
      label: Approval state
      options:
        - Manager approved, ready for checkout link
        - Budget approved, need receipt-capable checkout
        - Need reimbursement-friendly receipt
        - Need procurement or invoice details first
        - Drafting approval request
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Preferred checkout
      options:
        - Gumroad
        - Ko-fi
        - Lemon Squeezy
        - PayPal invoice
        - GitHub Sponsors
        - Other
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Purchase intent
      options:
        - I am ready to pay $203 for the 7-seat team license when checkout is ready
        - I am ready to pay $29 when checkout is ready
        - I need invoice or purchase-order details first
        - I want to evaluate the preview first
    validations:
      required: true
  - type: checkboxes
    id: delivery
    attributes:
      label: Delivery acknowledgement
      options:
        - label: I understand the paid ZIP is not public and will be delivered only after checkout, receipt, payout, or seller-dashboard evidence exists.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Approval blocker, team size, receipt requirement, invoice detail, or checkout preference.
    validations:
      required: false
