name: Expense report request
description: Request expense-report or reimbursement-ready checkout for the $203 Agent Ops team license
title: "Expense report request: Agent Ops Command Center"
labels: ["order-request", "expense-report"]
body:
  - type: markdown
    attributes:
      value: |
        Short request path for buyers who need an expense report, reimbursement packet, receipt, invoice, or payment proof before paying.

        Request package: Team license - 7 seats - $203 gross.
        Individual seat target: $29.

        Checkout is not live yet. This issue records purchase intent and preferred checkout. It is not counted as revenue until checkout, receipt, payout, or seller-dashboard evidence exists.

        Expense report mirror: https://ivelly42.github.io/ai-agent-expense-report-template/
        Receipt request mirror: https://ivelly42.github.io/ai-agent-receipt-request-template/
        Invoice request form: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=invoice-request.yml
        Budget request form: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=budget-request.yml
        Primary team request URL: https://ivelly42.github.io/agent-ops-command-center/team-request-url.html
        Checkout status: https://ivelly42.github.io/agent-ops-command-center/checkout-status.json
  - type: dropdown
    id: package
    attributes:
      label: Request package
      options:
        - Team license - 7 seats - $203 gross
        - Individual seat - $29
        - Evaluating preview only
    validations:
      required: true
  - type: dropdown
    id: expense_need
    attributes:
      label: Expense or reimbursement need
      options:
        - Need expense report before payment
        - Need reimbursement-friendly receipt
        - Need receipt-capable checkout
        - Need invoice or purchase-order details
        - Need manager approval before payment
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Preferred checkout
      options:
        - Gumroad
        - Ko-fi
        - Lemon Squeezy
        - PayPal invoice
        - GitHub Sponsors
        - Other
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Purchase intent
      options:
        - I am ready to pay $203 for the 7-seat team license when checkout is ready
        - I am ready to pay $29 when checkout is ready
        - I need expense, invoice, or reimbursement details first
        - I want to evaluate the preview first
    validations:
      required: true
  - type: checkboxes
    id: delivery
    attributes:
      label: Delivery acknowledgement
      options:
        - label: I understand the paid ZIP is not public and will be delivered only after checkout, receipt, payout, or seller-dashboard evidence exists.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Expense owner, reimbursement blocker, receipt field, card holder, cost center, team size, or checkout preference.
    validations:
      required: false
