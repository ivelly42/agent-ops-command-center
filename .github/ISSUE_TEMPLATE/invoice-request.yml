name: Invoice request
description: Request invoice or receipt-capable checkout for the $203 Agent Ops team license
title: "Invoice request: Agent Ops Command Center"
labels: ["order-request", "invoice-request"]
body:
  - type: markdown
    attributes:
      value: |
        Short request path for buyers who need invoice, purchase-order, receipt, or billing details before paying.

        Request package: Team license - 7 seats - $203 gross.
        Individual seat target: $29.

        Checkout is not live yet. This issue records purchase intent and preferred checkout. It is not counted as revenue until checkout, receipt, payout, or seller-dashboard evidence exists.

        Team invoice request packet: https://ivelly42.github.io/agent-ops-command-center/team-invoice-request.html
        Invoice request mirror: https://ivelly42.github.io/ai-agent-invoice-request-template/
        Team quote builder: https://ivelly42.github.io/agent-ops-command-center/team-quote.html
        Budget request form: https://github.com/ivelly42/agent-ops-command-center/issues/new?template=budget-request.yml
        Primary team request URL: https://ivelly42.github.io/agent-ops-command-center/team-request-url.html
        Checkout status: https://ivelly42.github.io/agent-ops-command-center/checkout-status.json
  - type: dropdown
    id: package
    attributes:
      label: Request package
      options:
        - Team license - 7 seats - $203 gross
        - Individual seat - $29
        - Evaluating preview only
    validations:
      required: true
  - type: dropdown
    id: billing_need
    attributes:
      label: Billing need
      options:
        - Need invoice before payment
        - Need receipt-capable checkout
        - Need purchase-order details
        - Need vendor or tax details
        - Need reimbursement-friendly receipt
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Preferred checkout
      options:
        - Gumroad
        - Ko-fi
        - Lemon Squeezy
        - PayPal invoice
        - GitHub Sponsors
        - Other
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Purchase intent
      options:
        - I am ready to pay $203 for the 7-seat team license when checkout is ready
        - I am ready to pay $29 when checkout is ready
        - I need invoice or purchase-order details first
        - I want to evaluate the preview first
    validations:
      required: true
  - type: checkboxes
    id: delivery
    attributes:
      label: Delivery acknowledgement
      options:
        - label: I understand the paid ZIP is not public and will be delivered only after checkout, receipt, payout, or seller-dashboard evidence exists.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Billing contact, PO requirement, receipt requirement, team size, approval blocker, or checkout preference.
    validations:
      required: false
