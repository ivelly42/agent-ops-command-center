name: Order request
description: Request early access to Agent Ops Command Center
title: "Order request: Agent Ops Command Center"
labels: ["order-request"]
body:
  - type: markdown
    attributes:
      value: |
        Request early access to the full Agent Ops Command Center pack.

        Price target: $29.
        Revenue target for this launch: 7 paid orders = $203 gross.

        Checkout is not live yet. This issue records purchase intent and preferred checkout. It is not counted as revenue until a real checkout, receipt, or seller dashboard exists.
        Product tour: https://ivelly42.github.io/agent-ops-command-center/product-tour.md
        ROI calculator: https://ivelly42.github.io/agent-ops-command-center/agent-ops-roi-calculator.md
        Cost leak audit: https://ivelly42.github.io/agent-ops-command-center/ai-agent-cost-leak-audit.md
        Model routing matrix: https://ivelly42.github.io/agent-ops-command-center/ai-agent-model-routing-matrix.md
        Prompt regression test: https://ivelly42.github.io/agent-ops-command-center/ai-agent-prompt-regression-test.md
        Acceptance test suite: https://ivelly42.github.io/agent-ops-command-center/ai-agent-acceptance-test-suite.md
        Security review checklist: https://ivelly42.github.io/agent-ops-command-center/ai-agent-security-review-checklist.md
        Incident report template: https://ivelly42.github.io/agent-ops-command-center/ai-agent-incident-report-template.md
        AI agent operating system scorecard: https://ivelly42.github.io/agent-ops-command-center/ai-agent-operating-system-template.md
        Codex vs Claude Code vs Cursor picker: https://ivelly42.github.io/agent-ops-command-center/codex-vs-claude-code-vs-cursor.md
        Buyer intake packet: https://ivelly42.github.io/agent-ops-command-center/buyer-intake-packet.md
        Purchase approval brief: https://ivelly42.github.io/agent-ops-command-center/purchase-approval-brief.md
        Workflow stack comparison: https://ivelly42.github.io/agent-ops-command-center/ai-agent-workflow-stack-comparison.md
        Preview index: https://ivelly42.github.io/agent-ops-command-center/github-preview-index.md
        Public Gist mirror: https://gist.github.com/ivelly42/c65a80192a848892d1196242027dc7a9
  - type: dropdown
    id: checkout
    attributes:
      label: Preferred checkout
      options:
        - Gumroad
        - Ko-fi
        - Lemon Squeezy
        - GitHub Sponsors
        - Other
    validations:
      required: true
  - type: checkboxes
    id: price
    attributes:
      label: Price acknowledgement
      options:
        - label: I understand the full pack target price is $29.
          required: true
  - type: textarea
    id: workflow
    attributes:
      label: Your AI-agent workflow
      description: Which tools do you use?
      placeholder: Codex, Claude Code, Cursor, local agents, browser QA, review agents...
    validations:
      required: false
  - type: dropdown
    id: intent
    attributes:
      label: Purchase intent
      options:
        - I am ready to pay $29 when checkout is ready
        - I want the full pack when checkout is ready
        - I want to evaluate the preview first
        - I only want updates for now
    validations:
      required: true
  - type: checkboxes
    id: delivery
    attributes:
      label: Delivery acknowledgement
      options:
        - label: I understand the paid ZIP is not public and will be delivered only after a real checkout exists.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Anything that would make the template more useful.
    validations:
      required: false
